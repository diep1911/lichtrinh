<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F5F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1116" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ứng dụng">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Ứng dụng</title>
<style>
:root{--bg:#F3F5F9;--surface:#fff;--ink:#12151C;--muted:#6B7385;--line:rgba(18,21,28,.08);--accent:#3556E8;--tint:#E8ECFF;--bar:rgba(255,255,255,.82);
--shadow:0 1px 2px rgba(18,21,28,.04),0 8px 20px rgba(18,21,28,.06);--ease:cubic-bezier(.22,.8,.24,1);--tab-h:62px}
@media(prefers-color-scheme:dark){:root{--bg:#0E1116;--surface:#181C24;--ink:#F1F3F8;--muted:#9AA3B5;--line:rgba(255,255,255,.09);--accent:#7B93FF;--tint:#232C4D;--bar:rgba(24,28,36,.82);--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 20px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
small{color:var(--muted);font-size:14px}
.g{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.app{position:relative;width:100%;max-width:430px;height:100dvh;margin:0 auto;overflow:hidden;background:var(--bg)}
@media(min-width:500px){.app{box-shadow:0 0 0 1px var(--line),0 24px 60px rgba(0,0,0,.12)}}
.stage{position:absolute;inset:0;transition:transform .4s var(--ease),filter .4s var(--ease)}
.app.pushed .stage{transform:translateX(-24%);filter:brightness(.9)}
.page{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:calc(env(safe-area-inset-top) + 12px) 20px calc(var(--tab-h) + env(safe-area-inset-bottom) + 100px);opacity:0;visibility:hidden;transition:opacity .28s var(--ease),transform .34s var(--ease),visibility 0s .34s}
.page.on{opacity:1;visibility:visible;transition-delay:0s}
.title{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.025em;margin:8px 0 20px}
.sec{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:28px 0 12px}
.hero{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;width:100%;min-height:156px;padding:22px;border-radius:26px;text-align:left;color:#fff;background:linear-gradient(150deg,#3556E8,#6481FF);box-shadow:0 14px 30px rgba(53,86,232,.28),0 2px 6px rgba(18,21,28,.1);transition:transform .2s var(--ease)}
.hero::after{content:"";position:absolute;right:-44px;top:-56px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.14)}
.hero small{color:rgba(255,255,255,.8)}.hero b{font-size:22px;letter-spacing:-.01em}.hero span{font-size:15px;opacity:.9}
.stack{display:grid;gap:12px}
.card,.tile{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);text-align:left;transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.card{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px}
.hero:active,.card:active,.tile:active{transform:scale(.97)}
.card:active,.tile:active{box-shadow:0 1px 2px rgba(18,21,28,.06)}
.bub{display:grid;place-items:center;flex:none;width:44px;height:44px;border-radius:14px;background:var(--tint);color:var(--accent)}
.tx{flex:1;display:grid;gap:2px}.tx b,.tile b{font-size:16px;font-weight:600}
.card>.g,.row .g{width:18px;height:18px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:grid;gap:4px;justify-items:start;align-content:start;min-height:136px;padding:16px}
.tile .bub{margin-bottom:12px}
.group{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;width:100%;padding:16px;font-weight:500;text-align:left;transition:background .15s}
.row+.row{border-top:1px solid var(--line)}
.row:active{background:var(--tint)}
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:10;display:flex;padding:6px 12px calc(6px + env(safe-area-inset-bottom));background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border-top:1px solid var(--line)}
.tab{flex:1;display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:500;color:var(--muted);transition:color .25s}
.tab .ico{display:grid;place-items:center;width:58px;height:30px;border-radius:15px;transition:background .28s var(--ease),transform .2s var(--ease)}
.tab:active .ico{transform:scale(.92)}
.tab[aria-selected=true]{color:var(--accent)}.tab[aria-selected=true] .ico{background:var(--tint)}
.fab{position:absolute;z-index:11;right:20px;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 18px);display:grid;place-items:center;width:58px;height:58px;border-radius:50%;color:#fff;background:linear-gradient(150deg,#3556E8,#6481FF);box-shadow:0 10px 22px rgba(53,86,232,.38),0 2px 6px rgba(18,21,28,.14);transition:transform .25s var(--ease)}
.fab .g{width:26px;height:26px;stroke-width:2.2;transition:transform .35s var(--ease)}
.fab:active{transform:scale(.92)}
.app.sheet-open .fab .g{transform:rotate(135deg)}
.detail{position:absolute;inset:0;z-index:30;overflow-y:auto;background:var(--bg);transform:translateX(100%);visibility:hidden;box-shadow:-10px 0 32px rgba(0,0,0,.14);transition:transform .4s var(--ease),visibility 0s .4s}
.detail.on{transform:none;visibility:visible;transition-delay:0s}
.dhead{display:flex;align-items:center;padding:env(safe-area-inset-top) 8px 0;min-height:calc(48px + env(safe-area-inset-top))}
.back{display:flex;align-items:center;gap:2px;height:44px;padding:0 10px 0 4px;color:var(--accent);font-weight:500;transition:opacity .15s}
.back:active{opacity:.5}.back .g{width:24px;height:24px}
.dbody{padding:12px 20px calc(32px + env(safe-area-inset-bottom))}
.big{display:grid;place-items:center;width:76px;height:76px;margin-bottom:20px;border-radius:24px;background:var(--tint);color:var(--accent);box-shadow:var(--shadow)}
.big .g{width:34px;height:34px}
.dbody h2{font-size:30px;letter-spacing:-.02em;margin:0 0 8px}
.dbody p{margin:0 0 28px;color:var(--muted);font-size:17px;line-height:1.5}
.btn{display:block;width:100%;height:52px;border-radius:16px;font-weight:600;font-size:17px;color:#fff;background:var(--accent);box-shadow:0 8px 18px rgba(53,86,232,.25);transition:transform .2s var(--ease)}
.btn:active{transform:scale(.97)}
.scrim{position:absolute;inset:0;z-index:40;background:rgba(10,12,18,.42);opacity:0;visibility:hidden;transition:opacity .3s var(--ease),visibility 0s .3s}
.app.sheet-open .scrim{opacity:1;visibility:visible;transition-delay:0s}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;padding:10px 20px calc(24px + env(safe-area-inset-bottom));border-radius:28px 28px 0 0;background:var(--surface);box-shadow:0 -12px 40px rgba(0,0,0,.2);transform:translateY(105%);transition:transform .42s var(--ease)}
.app.sheet-open .sheet{transform:none}
.grab{width:40px;height:5px;margin:0 auto 18px;border-radius:3px;background:var(--line)}
.sheet h3{font-size:22px;letter-spacing:-.01em;margin:0 0 6px}.sheet p{margin:0 0 22px;color:var(--muted)}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;transition-delay:0s!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
<symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></symbol>
<symbol id="i-more" viewBox="0 0 24 24"><g fill="currentColor" stroke="none"><circle cx="5.5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18.5" cy="12" r="1.7"/></g></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></symbol>
<symbol id="i-card" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="4.5"/></symbol>
</defs></svg>

<div class="app" id="app">
  <div class="stage">
    <main class="page on" id="p0" role="tabpanel" aria-labelledby="t0">
      <h1 class="title">Trang chủ</h1>
      <button class="hero" data-t="Thẻ nổi bật"><small>Nổi bật</small><b>Thẻ nổi bật</b><span>Mô tả ngắn của thẻ nổi bật.</span></button>
      <h2 class="sec">Gần đây</h2>
      <div class="stack" id="list"></div>
    </main>
    <section class="page" id="p1" role="tabpanel" aria-labelledby="t1" inert>
      <h1 class="title">Nội dung</h1>
      <div class="grid" id="grid"></div>
    </section>
    <section class="page" id="p2" role="tabpanel" aria-labelledby="t2" inert>
      <h1 class="title">Khác</h1>
      <div class="group" id="rows"></div>
    </section>
    <nav class="tabbar" role="tablist" aria-label="Điều hướng chính">
      <button class="tab" role="tab" id="t0" aria-controls="p0" aria-selected="true"><span class="ico"><svg class="g" aria-hidden="true"><use href="#i-home"/></svg></span>Trang chủ</button>
      <button class="tab" role="tab" id="t1" aria-controls="p1" aria-selected="false"><span class="ico"><svg class="g" aria-hidden="true"><use href="#i-grid"/></svg></span>Nội dung</button>
      <button class="tab" role="tab" id="t2" aria-controls="p2" aria-selected="false"><span class="ico"><svg class="g" aria-hidden="true"><use href="#i-more"/></svg></span>Khác</button>
    </nav>
    <button class="fab" id="fab" aria-label="Tạo mới" aria-expanded="false"><svg class="g" aria-hidden="true"><use href="#i-plus"/></svg></button>
  </div>

  <section class="detail" id="detail" aria-label="Chi tiết" inert>
    <div class="dhead"><button class="back" id="back"><svg class="g" aria-hidden="true"><use href="#i-back"/></svg>Quay lại</button></div>
    <div class="dbody">
      <div class="big"><svg class="g" aria-hidden="true"><use href="#i-card"/></svg></div>
      <h2 id="dt">Thẻ</h2>
      <p>Nội dung mẫu cho màn hình chi tiết.</p>
      <button class="btn" id="done">Xong</button>
    </div>
  </section>

  <div class="scrim" id="scrim"></div>
  <aside class="sheet" id="sheet" role="dialog" aria-label="Tạo mới" inert>
    <div class="grab"></div>
    <h3>Tạo mới</h3>
    <p>Khu vực này dành cho nội dung của hành động.</p>
    <button class="btn" id="close">Đóng</button>
  </aside>
</div>

<script>
(function(){
  var $=function(s){return document.querySelector(s)},$$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};
  var app=$("#app"),pages=$$(".page"),tabs=$$(".tab"),detail=$("#detail"),sheet=$("#sheet"),fab=$("#fab"),cur=0,back=null;
  function ic(n){return '<svg class="g" aria-hidden="true"><use href="#i-'+n+'"/></svg>'}
  $("#list").innerHTML=[1,2,3,4].map(function(n){return '<button class="card" data-t="Thẻ '+n+'"><span class="bub">'+ic("card")+'</span><span class="tx"><b>Thẻ '+n+'</b><small>Mô tả ngắn của thẻ.</small></span>'+ic("chev")+'</button>'}).join("");
  $("#grid").innerHTML=[1,2,3,4,5,6].map(function(n){return '<button class="tile" data-t="Thẻ '+n+'"><span class="bub">'+ic("card")+'</span><b>Thẻ '+n+'</b><small>Mô tả ngắn.</small></button>'}).join("");
  $("#rows").innerHTML=[1,2,3].map(function(n){return '<button class="row" data-t="Mục '+n+'">Mục '+n+ic("chev")+'</button>'}).join("");

  function go(i){
    if(i===cur)return;
    var d=i>cur?1:-1,o=pages[cur],n=pages[i];
    n.style.transition="none";n.style.transform="translateX("+d*14+"%)";n.scrollTop=0;void n.offsetWidth;
    n.style.transition="";n.style.transform="";n.classList.add("on");n.inert=false;
    o.classList.remove("on");o.inert=true;o.style.transform="translateX("+(-d*14)+"%)";
    setTimeout(function(){if(!o.classList.contains("on"))o.style.transform=""},380);
    tabs.forEach(function(t,k){t.setAttribute("aria-selected",k===i)});cur=i;
  }
  function openDetail(t){back=document.activeElement;$("#dt").textContent=t;detail.inert=false;detail.scrollTop=0;detail.classList.add("on");app.classList.add("pushed");$("#back").focus({preventScroll:true})}
  function closeDetail(){detail.classList.remove("on");app.classList.remove("pushed");detail.inert=true;if(back)back.focus({preventScroll:true})}
  function toggleSheet(o){app.classList.toggle("sheet-open",o);sheet.inert=!o;fab.setAttribute("aria-expanded",o);if(o)$("#close").focus({preventScroll:true});else fab.focus({preventScroll:true})}

  tabs.forEach(function(t,k){t.addEventListener("click",function(){go(k)})});
  app.addEventListener("click",function(e){var c=e.target.closest("[data-t]");if(c)openDetail(c.getAttribute("data-t"))});
  $("#back").addEventListener("click",closeDetail);$("#done").addEventListener("click",closeDetail);
  fab.addEventListener("click",function(){toggleSheet(!app.classList.contains("sheet-open"))});
  $("#scrim").addEventListener("click",function(){toggleSheet(false)});$("#close").addEventListener("click",function(){toggleSheet(false)});
  document.addEventListener("keydown",function(e){if(e.key!=="Escape")return;if(app.classList.contains("sheet-open"))toggleSheet(false);else if(detail.classList.contains("on"))closeDetail()});
  if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(function(){});
})();
</script>
</body>
</html>
